apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: api
  namespace: platform
spec:
  selector:
    matchLabels:
      app: api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
# Apply the following as Terraform google_monitoring_alert_policy resources in the platform project.
# Keep alert thresholds aligned with the SLO error budget and on-call policy.
